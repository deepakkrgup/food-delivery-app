<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieApp 3D - Live Backend</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* Moving Neon Background */
        .neon-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, rgba(59,130,246,0.05) 25%, transparent 25%),
            linear-gradient(-45deg, rgba(236,72,153,0.05) 25%, transparent 25%);
            background-size: 60px 60px;
            z-index: -1;
            animation: move-bg 10s linear infinite;
        }
        @keyframes move-bg { from { background-position: 0 0; } to { background-position: 60px 60px; } }

        /* Navigation */
        nav {
            padding: 20px 10%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.02); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.5rem; color: #3b82f6; text-shadow: 0 0 10px #3b82f6; }

        /* Containers */
        .container {
            display: none; width: 100%; max-width: 450px; margin: 100px auto;
            padding: 40px; border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transform-style: preserve-3d;
            animation: float-up 0.6s ease-out;
        }
        .active { display: block; }
        @keyframes float-up { from { opacity: 0; transform: translateY(30px) rotateX(-5deg); } to { opacity: 1; transform: translateY(0); } }

        /* Inputs & Buttons */
        input, textarea {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;
        }
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 20px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .btn:hover { transform: scale(1.05) translateZ(20px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        /* Menu Section */
        #menuSection.container { max-width: 1100px; background: transparent; border: none; box-shadow: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }

        /* 3D Food Card */
        .card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 25px; padding: 30px; text-align: center;
            transition: transform 0.1s ease; transform-style: preserve-3d;
        }
        .card h3 { font-size: 1.5rem; transform: translateZ(50px); color: #60a5fa; }
        .card p { color: #94a3b8; transform: translateZ(30px); margin: 10px 0; }
        .card .price { font-size: 1.8rem; font-weight: 700; color: #10b981; transform: translateZ(40px); }
        .order-btn { background: #f59e0b; color: white; transform: translateZ(60px); }
    </style>
</head>
<body>

<div class="neon-bg"></div>

<nav id="topNav">
    <div class="logo">FOODIE_VIBE</div>
    <div id="navLinks">
        <button class="btn" style="width: auto; padding: 10px 20px;" onclick="showSection('loginBox')">Login</button>
    </div>
</nav>

<div id="regBox" class="container">
    <h2 style="text-align:center; margin-bottom:20px;">Join the Vibe</h2>
    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email Address">
    <input type="password" id="regPass" placeholder="Password (Min 6)">
    <textarea id="regAddr" placeholder="Delivery Address"></textarea>
    <button class="btn btn-success" onclick="doRegister()">Sign Up</button>
    <p style="text-align:center; margin-top:15px; cursor:pointer;" onclick="showSection('loginBox')">Already a member? Login</p>
</div>

<div id="loginBox" class="container active">
    <h2 style="text-align:center; margin-bottom:20px;">Welcome Back</h2>
    <input type="email" id="logEmail" placeholder="Email">
    <input type="password" id="logPass" placeholder="Password">
    <button class="btn btn-primary" onclick="doLogin()">Enter App</button>
    <p style="text-align:center; margin-top:15px; cursor:pointer;" onclick="showSection('regBox')">New here? Register</p>
</div>

<div id="menuSection" class="container">
    <h1 style="text-align:center; margin-bottom:40px; font-family:'Orbitron';">LIVE MENU</h1>
    <div id="foodGrid" class="grid"></div>
</div>

<script>
    const API = "http://localhost:8081/api"; // Updated Port

    // 1. REGISTER [cite: 13, 21, 54]
    async function doRegister() {
        const user = {
            name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPass').value,
            address: document.getElementById('regAddr').value
        };
        try {
            const res = await fetch(`${API}/users/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            });
            const msg = await res.text();
            alert(msg);
            if(res.ok) showSection('loginBox');
        } catch(e) { alert("Backend Dead!"); }
    }

    // 2. LOGIN [cite: 14, 55, 57]
    async function doLogin() {
        const user = {
            email: document.getElementById('logEmail').value,
            password: document.getElementById('logPass').value
        };
        try {
            const res = await fetch(`${API}/users/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            });
            const msg = await res.text();
            if(msg.includes("Successfully")) {
                document.getElementById('topNav').style.display = 'none';
                showSection('menuSection');
            } else { alert(msg); }
        } catch(e) { alert("Check Connection!"); }
    }

    // 3. LOAD MENU [cite: 6, 23, 45]
    async function loadMenu() {
        const grid = document.getElementById('foodGrid');
        grid.innerHTML = '<p>Syncing items...</p>';
        try {
            const res = await fetch(`${API}/fooditem`);
            const items = await res.json();
            grid.innerHTML = '';
            items.forEach(it => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${it.name}</h3>
                    <p>${it.description}</p>
                    <div class="price">₹${it.price}</div>
                    <button class="btn order-btn" onclick="orderNow(${it.id})">ORDER NOW</button>
                `;
                // Add 3D Mouse Tilt
                card.addEventListener('mousemove', (e) => {
                    let ax = (window.innerWidth/2 - e.pageX)/20;
                    let ay = (window.innerHeight/2 - e.pageY)/20;
                    card.style.transform = `rotateY(${ax}deg) rotateX(${ay}deg)`;
                });
                card.addEventListener('mouseleave', () => card.style.transform = `rotate(0)`);
                grid.appendChild(card);
            });
        } catch(e) { grid.innerHTML = '<p style="color:red;">Error loading items!</p>'; }
    }

    function showSection(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'menuSection') loadMenu();
    }

    function orderNow(id) { alert("Order request sent for Item ID: " + id); }
</script>
</body>
</html>
